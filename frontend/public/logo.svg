<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M 100,18 C 145,18 178,32 178,32 C 178,98 152,156 100,182 C 48,156 22,98 22,32 C 22,32 55,18 100,18 Z" 
        fill="url(#shieldGrad)" stroke="#334155" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Shield Accent Border -->
  <path d="M 100,26 C 140,26 168,38 168,38 C 168,96 144,148 100,172 C 56,148 32,96 32,38 C 32,38 60,26 100,26 Z" 
        fill="none" stroke="url(#accentOrange)" stroke-width="2" opacity="0.4" stroke-dasharray="4 2" />

  <!-- Radio Mesh Waves (Upper / Surrounding) -->
  <path d="M 52,82 A 56,56 0 0,1 148,82" fill="none" stroke="url(#waveCyan)" stroke-width="4" stroke-linecap="round" opacity="0.45" />
  <path d="M 64,92 A 42,42 0 0,1 136,92" fill="none" stroke="url(#waveCyan)" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <path d="M 76,102 A 28,28 0 0,1 124,102" fill="none" stroke="url(#waveCyan)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Mesh Network Nodes & Interconnects -->
  <line x1="100" y1="110" x2="68" y2="138" stroke="#64748B" stroke-width="2.5" stroke-dasharray="2 3" />
  <line x1="100" y1="110" x2="132" y2="138" stroke="#64748B" stroke-width="2.5" stroke-dasharray="2 3" />
  <line x1="68" y1="138" x2="132" y2="138" stroke="#64748B" stroke-width="2" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Side Mesh Nodes -->
  <circle cx="68" cy="138" r="5" fill="#38BDF8" stroke="#0F172A" stroke-width="2" />
  <circle cx="132" cy="138" r="5" fill="#38BDF8" stroke="#0F172A" stroke-width="2" />

  <!-- Antenna Mast Tower -->
  <line x1="100" y1="110" x2="100" y2="156" stroke="url(#accentOrange)" stroke-width="5" stroke-linecap="round" />
  <line x1="90" y1="156" x2="110" y2="156" stroke="url(#accentOrange)" stroke-width="4" stroke-linecap="round" />
  <line x1="88" y1="140" x2="112" y2="140" stroke="url(#accentOrange)" stroke-width="3" stroke-linecap="round" />

  <!-- Center Transmitter Beacon Node -->
  <circle cx="100" cy="110" r="10" fill="url(#accentOrange)" filter="url(#glow)" />
  <circle cx="100" cy="110" r="4.5" fill="#FFFFFF" />

  <!-- Cross / Rescue Medical Aid Accent Mark -->
  <path d="M 97,44 L 103,44 L 103,50 L 109,50 L 109,56 L 103,56 L 103,62 L 97,62 L 97,56 L 91,56 L 91,50 L 97,50 Z" 
        fill="#FF5722" />
</svg>